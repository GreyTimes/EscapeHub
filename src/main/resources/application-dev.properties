# Development-only CORS configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Automatically update database schema during development
spring.jpa.hibernate.ddl-auto=update

# Development-only identity and sample mission.
app.dev.user-id=${VITE_DEV_USER_ID:00000000-0000-4000-8000-000000000001}
app.dev.user-display-name=${DEV_USER_DISPLAY_NAME:Local Developer}
app.dev.mission-resource=classpath:missions/blackwood-case-v2.json
