name: Bug Report
description: Report a bug
title: "[BUG] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      placeholder: "1. Open...\n2. Click...\n3. ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
    validations:
      required: true