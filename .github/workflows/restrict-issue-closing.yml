
name: Restrict Issue Closing

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  check-closer:
    runs-on: ubuntu-latest

    steps:
      - name: Reopen issue if closed by someone else
        uses: actions/github-script@v7
        with:
          script: |
            const allowedUser = 'GreyTimes';
            const actor = context.actor;

            if (actor.toLowerCase() === allowedUser.toLowerCase()) {
              console.log('Issue closed by authorized user.');
              return;
            }

            console.log(`Issue closed by ${actor}. Reopening...`);

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'open'
            });

            console.log('Issue successfully reopened.');
